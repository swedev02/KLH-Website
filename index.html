    <!-- Home page: start fetching the first banner (the largest thing on screen) before the app's JavaScript runs.
         Same file and sizes as the AVIF <source> Img renders for it; keep in sync with HOME_SLIDES[0] in src/data.js. -->
    <script>
      if (location.pathname === '/') {
        var l = document.createElement('link'), f = '/2026/04/bann1er3-1.avif'
        l.rel = 'preload'; l.as = 'image'; l.type = 'image/avif'; l.fetchPriority = 'high'
        l.setAttribute('imagesrcset', '/img/640' + f + ' 640w, /img/1280' + f + ' 1280w, /img/1920' + f + ' 1920w')
        l.setAttribute('imagesizes', '100vw')
        document.head.appendChild(l)
      }
    </script>
  </head>
